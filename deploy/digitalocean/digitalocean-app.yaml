name: mechmind-ai-platform
region: nyc
services:
  # 1. FastAPI REST & Ingestion Engine
  - name: mechmind-backend
    github:
      branch: main
      deploy_on_push: true
      repo: DevMubarak1/mechmind-ai
    source_dir: backend
    dockerfilePath: backend/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${mechmind-db.DATABASE_URL}
      - key: CHROMA_URL
        scope: RUN_TIME
        value: http://mechmind-chroma:8100
      - key: OLLAMA_MODEL
        scope: RUN_TIME
        value: gemma2:2b
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10

  # 2. ChromaDB Vector Knowledge Store
  - name: mechmind-chroma
    image:
      registry_type: DOCKER_HUB
      repository: chromadb/chroma
      tag: latest
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: IS_PERSISTENT
        scope: RUN_TIME
        value: "TRUE"

  # 3. WhatsApp Copilot Gateway
  - name: mechmind-whatsapp-bot
    github:
      branch: main
      deploy_on_push: true
      repo: DevMubarak1/mechmind-ai
    source_dir: whatsapp-bot
    http_port: 3001
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: BACKEND_URL
        scope: RUN_TIME
        value: http://mechmind-backend:8080
      - key: BOT_PORT
        scope: RUN_TIME
        value: "3001"

databases:
  - name: mechmind-db
    engine: PG
    version: "16"
    production: false
